<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Hexagon Outer Boundary Gradient -->
    <linearGradient id="hexBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8" />
    </linearGradient>

    <!-- Metallic Portal Segment Gradients -->
    <!-- Top-Left: Bright Chrome / Specular Highlight -->
    <linearGradient id="metalTopLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Top-Right: Brushed Cool Silver -->
    <linearGradient id="metalTopRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Bottom-Left: Steel Blue Metallic -->
    <linearGradient id="metalBotLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="80%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Bottom-Right: Titanium Shadow Metallic -->
    <linearGradient id="metalBotRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="45%" stop-color="#475569" />
      <stop offset="85%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Portal Core Radial Glow -->
    <radialGradient id="portalCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#070d1a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Ghost Body Holographic Gradient -->
    <linearGradient id="ghostBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="28%" stop-color="#f0fdfa" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#bae6fd" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.55" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseCyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="3.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientHexGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- ================= GHOSTRING 1:1 EMBLEM ================= -->
  <g transform="translate(256, 256) scale(1.22)">

    <!-- Ambient Glow behind Emblem -->
    <circle cx="0" cy="0" r="160" fill="#00f2fe" opacity="0.16" filter="url(#ambientHexGlow)" />

    <!-- HEXAGON BASE & CIRCUIT NETWORK -->
    <g>
      <!-- Deep Dark Navy Hexagonal Shield Plate -->
      <polygon points="0,-154 133,-77 133,77 0,154 -133,77 -133,-77" fill="#09101f" stroke="#1d2e4a" stroke-width="3.5" />
      
      <!-- Hexagon Outer Cyber Glow Border -->
      <polygon points="0,-154 133,-77 133,77 0,154 -133,77 -133,-77" fill="none" stroke="url(#hexBorderGrad)" stroke-width="2" filter="url(#cyanGlow)" opacity="0.85" />

      <!-- Intricate Cyber Circuit Pathways Radiating on the Hexagon Face -->
      <g stroke="#00f2fe" stroke-width="1.8" fill="none" opacity="0.85">
        <!-- Top Traces flanking 12 o'clock -->
        <path d="M -16,-136 L -42,-136 L -65,-123 L -100,-123" />
        <path d="M 16,-136 L 42,-136 L 65,-123 L 100,-123" />
        <path d="M -22,-144 L -50,-144 L -72,-132" />
        <path d="M 22,-144 L 50,-144 L 72,-132" />

        <!-- Upper Left Perimeter Traces -->
        <path d="M -122,-62 L -105,-62 L -94,-46 L -94,-18" />
        <path d="M -130,-42 L -114,-42 L -98,-20" />
        <path d="M -102,-80 L -88,-72 L -88,-50" />

        <!-- Upper Right Perimeter Traces -->
        <path d="M 122,-62 L 105,-62 L 94,-46 L 94,-18" />
        <path d="M 130,-42 L 114,-42 L 98,-20" />
        <path d="M 102,-80 L 88,-72 L 88,-50" />

        <!-- Lower Left Perimeter Traces -->
        <path d="M -122,62 L -105,62 L -94,46 L -94,18" />
        <path d="M -130,42 L -114,42 L -98,20" />
        <path d="M -102,80 L -88,72 L -88,50" />

        <!-- Lower Right Perimeter Traces -->
        <path d="M 122,62 L 105,62 L 94,46 L 94,18" />
        <path d="M 130,42 L 114,42 L 98,20" />
        <path d="M 102,80 L 88,72 L 88,50" />

        <!-- Bottom Traces flanking 6 o'clock -->
        <path d="M -16,136 L -42,136 L -65,123 L -100,123" />
        <path d="M 16,136 L 42,136 L 65,123 L 100,123" />
        <path d="M -22,144 L -50,144 L -72,132" />
        <path d="M 22,144 L 50,144 L 72,132" />

        <!-- Solder Terminal Pads / Nodes (Vias) -->
        <g fill="#00f2fe" stroke="none">
          <circle cx="-100" cy="-123" r="3" />
          <circle cx="100" cy="-123" r="3" />
          <circle cx="-72" cy="-132" r="2.5" />
          <circle cx="72" cy="-132" r="2.5" />
          
          <circle cx="-94" cy="-18" r="2.8" />
          <circle cx="94" cy="-18" r="2.8" />
          <circle cx="-98" cy="-20" r="2.8" />
          <circle cx="98" cy="-20" r="2.8" />
          <circle cx="-88" cy="-50" r="2.5" />
          <circle cx="88" cy="-50" r="2.5" />

          <circle cx="-94" cy="18" r="2.8" />
          <circle cx="94" cy="18" r="2.8" />
          <circle cx="-98" cy="20" r="2.8" />
          <circle cx="98" cy="20" r="2.8" />
          <circle cx="-88" cy="50" r="2.5" />
          <circle cx="88" cy="50" r="2.5" />

          <circle cx="-100" cy="123" r="3" />
          <circle cx="100" cy="123" r="3" />
          <circle cx="-72" cy="132" r="2.5" />
          <circle cx="72" cy="132" r="2.5" />
        </g>
      </g>
    </g>

    <!-- 6 GLOWING CYAN SECURITY PADLOCKS -->
    <!-- 1. Top Padlock (0, -154) -->
    <g transform="translate(0, -154)">
      <rect x="-14" y="-13" width="28" height="26" rx="6" fill="#070e1b" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M -5,-3 V -8 A 5,5 0 0,1 5,-8 V -3" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <rect x="-7.5" y="-3" width="15" height="13" rx="2.5" fill="#0e1f38" stroke="#00f2fe" stroke-width="1.6" filter="url(#cyanGlow)" />
      <circle cx="0" cy="2.5" r="1.4" fill="#00f2fe" />
      <path d="M 0,3 V 6.5" stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- 2. Top-Right Padlock (133, -77) -->
    <g transform="translate(133, -77)">
      <rect x="-14" y="-13" width="28" height="26" rx="6" fill="#070e1b" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M -5,-3 V -8 A 5,5 0 0,1 5,-8 V -3" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <rect x="-7.5" y="-3" width="15" height="13" rx="2.5" fill="#0e1f38" stroke="#00f2fe" stroke-width="1.6" filter="url(#cyanGlow)" />
      <circle cx="0" cy="2.5" r="1.4" fill="#00f2fe" />
      <path d="M 0,3 V 6.5" stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- 3. Bottom-Right Padlock (133, 77) -->
    <g transform="translate(133, 77)">
      <rect x="-14" y="-13" width="28" height="26" rx="6" fill="#070e1b" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M -5,-3 V -8 A 5,5 0 0,1 5,-8 V -3" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <rect x="-7.5" y="-3" width="15" height="13" rx="2.5" fill="#0e1f38" stroke="#00f2fe" stroke-width="1.6" filter="url(#cyanGlow)" />
      <circle cx="0" cy="2.5" r="1.4" fill="#00f2fe" />
      <path d="M 0,3 V 6.5" stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- 4. Bottom Padlock (0, 154) -->
    <g transform="translate(0, 154)">
      <rect x="-14" y="-13" width="28" height="26" rx="6" fill="#070e1b" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M -5,-3 V -8 A 5,5 0 0,1 5,-8 V -3" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <rect x="-7.5" y="-3" width="15" height="13" rx="2.5" fill="#0e1f38" stroke="#00f2fe" stroke-width="1.6" filter="url(#cyanGlow)" />
      <circle cx="0" cy="2.5" r="1.4" fill="#00f2fe" />
      <path d="M 0,3 V 6.5" stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- 5. Bottom-Left Padlock (-133, 77) -->
    <g transform="translate(-133, 77)">
      <rect x="-14" y="-13" width="28" height="26" rx="6" fill="#070e1b" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M -5,-3 V -8 A 5,5 0 0,1 5,-8 V -3" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <rect x="-7.5" y="-3" width="15" height="13" rx="2.5" fill="#0e1f38" stroke="#00f2fe" stroke-width="1.6" filter="url(#cyanGlow)" />
      <circle cx="0" cy="2.5" r="1.4" fill="#00f2fe" />
      <path d="M 0,3 V 6.5" stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- 6. Top-Left Padlock (-133, -77) -->
    <g transform="translate(-133, -77)">
      <rect x="-14" y="-13" width="28" height="26" rx="6" fill="#070e1b" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M -5,-3 V -8 A 5,5 0 0,1 5,-8 V -3" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <rect x="-7.5" y="-3" width="15" height="13" rx="2.5" fill="#0e1f38" stroke="#00f2fe" stroke-width="1.6" filter="url(#cyanGlow)" />
      <circle cx="0" cy="2.5" r="1.4" fill="#00f2fe" />
      <path d="M 0,3 V 6.5" stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- ================= PORTAL VAULT RING (RING 0) ================= -->
    <!-- Radiant Outer & Inner Neon Cyan Rings -->
    <circle r="124" fill="none" stroke="#00f2fe" stroke-width="5" opacity="0.65" filter="url(#intenseCyanGlow)" />
    <circle r="75" fill="none" stroke="#00f2fe" stroke-width="5" opacity="0.8" filter="url(#cyanGlow)" />

    <!-- Deep Metal Base Ring -->
    <circle r="123" fill="#0c1626" stroke="#00f2fe" stroke-width="1.5" />

    <!-- 4 Chunky Metallic Quadrant Plates -->
    <!-- Top-Right Quadrant -->
    <path d="M 14.87,-121.09 A 122,122 0 0,1 121.09,-14.87 L 75.43,-9.26 A 76,76 0 0,0 9.26,-75.43 Z" fill="url(#metalTopRight)" stroke="#475569" stroke-width="1.2" />
    <!-- Top-Left Quadrant -->
    <path d="M -121.09,-14.87 A 122,122 0 0,1 -14.87,-121.09 L -9.26,-75.43 A 76,76 0 0,0 -75.43,-9.26 Z" fill="url(#metalTopLeft)" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Bottom-Left Quadrant -->
    <path d="M -14.87,121.09 A 122,122 0 0,1 -121.09,14.87 L -75.43,9.26 A 76,76 0 0,0 -9.26,75.43 Z" fill="url(#metalBotLeft)" stroke="#334155" stroke-width="1.2" />
    <!-- Bottom-Right Quadrant -->
    <path d="M 121.09,14.87 A 122,122 0 0,1 14.87,121.09 L 9.26,75.43 A 76,76 0 0,0 75.43,9.26 Z" fill="url(#metalBotRight)" stroke="#334155" stroke-width="1.2" />

    <!-- Specular Bevel Highlights on Ring Outer Rim -->
    <path d="M -119.16,-21.01 A 121,121 0 0,1 -21.01,-119.16" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.85" />
    <path d="M 21.01,-119.16 A 121,121 0 0,1 119.16,-21.01" fill="none" stroke="#e2e8f0" stroke-width="1.3" opacity="0.7" />
    <path d="M 119.16,21.01 A 121,121 0 0,1 21.01,119.16" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.5" />
    <path d="M -21.01,119.16 A 121,121 0 0,1 -119.16,21.01" fill="none" stroke="#94a3b8" stroke-width="1.2" opacity="0.6" />

    <!-- Specular Bevel Highlights on Ring Inner Rim -->
    <path d="M -75.83,-13.37 A 77,77 0 0,1 -13.37,-75.83" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.85" />
    <path d="M 13.37,-75.83 A 77,77 0 0,1 75.83,-13.37" fill="none" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" />

    <!-- Mid-Plate Engraved Glowing Cyan Channels -->
    <g stroke="#00f2fe" stroke-width="2.6" fill="none" filter="url(#cyanGlow)" stroke-linecap="round">
      <path d="M 17.19,-97.50 A 99,99 0 0,1 97.50,-17.19" />
      <path d="M 97.50,17.19 A 99,99 0 0,1 17.19,97.50" />
      <path d="M -17.19,97.50 A 99,99 0 0,1 -97.50,17.19" />
      <path d="M -97.50,-17.19 A 99,99 0 0,1 -17.19,-97.50" />
    </g>
    <!-- Crisp White Core Line Inside Groove -->
    <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.85" stroke-linecap="round">
      <path d="M 17.19,-97.50 A 99,99 0 0,1 97.50,-17.19" />
      <path d="M 97.50,17.19 A 99,99 0 0,1 17.19,97.50" />
      <path d="M -17.19,97.50 A 99,99 0 0,1 -97.50,17.19" />
      <path d="M -97.50,-17.19 A 99,99 0 0,1 -17.19,-97.50" />
    </g>

    <!-- Notch Indicator Gems (Diamonds at Top & Bottom) -->
    <!-- Top Diamond at Y = -99 -->
    <g transform="translate(0, -99)">
      <polygon points="0,-12 6.5,0 0,12 -6.5,0" fill="#00f2fe" filter="url(#intenseCyanGlow)" />
      <polygon points="0,-9 4.5,0 0,9 -4.5,0" fill="#ffffff" />
    </g>
    <!-- Bottom Diamond at Y = 99 -->
    <g transform="translate(0, 99)">
      <polygon points="0,-12 6.5,0 0,12 -6.5,0" fill="#00f2fe" filter="url(#intenseCyanGlow)" />
      <polygon points="0,-9 4.5,0 0,9 -4.5,0" fill="#ffffff" />
    </g>

    <!-- Horizontal Notch Seams at 9 o'clock & 3 o'clock -->
    <line x1="-123" y1="0" x2="-76" y2="0" stroke="#00f2fe" stroke-width="2.2" filter="url(#cyanGlow)" />
    <line x1="76" y1="0" x2="123" y2="0" stroke="#00f2fe" stroke-width="2.2" filter="url(#cyanGlow)" />

    <!-- ================= PORTAL VOID & GHOST (KERNEL 0) ================= -->
    <!-- Portal Void Interior -->
    <circle r="75" fill="#050811" />
    <circle r="75" fill="url(#portalCoreGlow)" />
    <circle r="75" fill="none" stroke="#00f2fe" stroke-width="2.2" opacity="0.95" filter="url(#cyanGlow)" />

    <!-- Glowing High-Tech Cute Ghost -->
    <g transform="translate(0, -2)">
      <!-- Outer Ghost Cyan Halo / Glow -->
      <path d="M 0,-44 
               C -19,-44 -30,-29 -30,-10 
               C -30,-3 -37,2 -43,7 
               C -46,11 -44,18 -39,20 
               C -31,22 -26,14 -23,23 
               C -20,31 -27,39 -23,47 
               C -20,52 -13,50 -9,43 
               C -4,36 1,43 7,42 
               C 13,41 20,47 25,38 
               C 28,32 23,23 23,15 
               C 26,7 32,16 41,13 
               C 46,11 46,5 42,1 
               C 36,-4 30,-7 30,-10 
               C 30,-29 19,-44 0,-44 Z" 
            fill="#00f2fe" opacity="0.4" filter="url(#intenseCyanGlow)" />

      <!-- Ghost Main Holographic Silhouette Body -->
      <path d="M 0,-44 
               C -19,-44 -30,-29 -30,-10 
               C -30,-3 -37,2 -43,7 
               C -46,11 -44,18 -39,20 
               C -31,22 -26,14 -23,23 
               C -20,31 -27,39 -23,47 
               C -20,52 -13,50 -9,43 
               C -4,36 1,43 7,42 
               C 13,41 20,47 25,38 
               C 28,32 23,23 23,15 
               C 26,7 32,16 41,13 
               C 46,11 46,5 42,1 
               C 36,-4 30,-7 30,-10 
               C 30,-29 19,-44 0,-44 Z" 
            fill="url(#ghostBodyGrad)" stroke="#00f2fe" stroke-width="1.8" />

      <!-- Ghost Eyes -->
      <!-- Left Eye -->
      <ellipse cx="-11" cy="-18" rx="4.5" ry="6.8" fill="#081021" />
      <circle cx="-9.2" cy="-21" r="1.6" fill="#ffffff" />
      <!-- Right Eye -->
      <ellipse cx="11" cy="-18" rx="4.5" ry="6.8" fill="#081021" />
      <circle cx="12.8" cy="-21" r="1.6" fill="#ffffff" />

      <!-- Ghost Mouth (Cute Open O) -->
      <ellipse cx="0" cy="-5" rx="3.6" ry="5.2" fill="#081021" />
      <ellipse cx="0" cy="-3.5" rx="2.2" ry="2.2" fill="#132a45" />

      <!-- Cyber Circuit Traces Inside Ghost Belly -->
      <g stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.95" filter="url(#cyanGlow)">
        <!-- Center Vertical Data Bus -->
        <path d="M 0,3 V 28" />
        <circle cx="0" cy="28" r="2.5" fill="#00f2fe" stroke="none" />
        <!-- Left Branch -->
        <path d="M -8,7 V 18 L -14,24 V 31" />
        <circle cx="-14" cy="31" r="2.2" fill="#00f2fe" stroke="none" />
        <!-- Right Branch -->
        <path d="M 8,7 V 16 L 14,22 V 27" />
        <circle cx="14" cy="27" r="2.2" fill="#00f2fe" stroke="none" />
      </g>

      <!-- Ring "0" Floating on Lower Right of Ghost -->
      <g transform="translate(34, 18)">
        <rect x="-9" y="-13" width="18" height="26" rx="9" fill="#081426" stroke="#00f2fe" stroke-width="2.5" filter="url(#cyanGlow)" />
        <rect x="-5.5" y="-9.5" width="11" height="19" rx="5.5" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.85" />
      </g>
    </g>
  </g>
</svg>
